name: Gerar APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ProtoMax-Arcade.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ProtoMax-Arcade
          path: ProtoMax-Arcade.apk
